.role-wrap{display:flex;align-items:center;gap:6px}

.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);border-bottom:1px solid var(--rule)}
.stat{background:var(--page);padding:1rem 2rem}

.stat-lbl{font-size:11px;color:var(--ink-3);margin-top:2px;letter-spacing:.04em}

  async req(method, path, body){
    setSyncStatus('loading');
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
        method,
        headers:{
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'application/json',

          {text:'Connect: Self-Study (Canva)', team:'Ops Team', teamCls:'b-amber', meta:'Posted — 4 videos live', status:'complete'},

let currentIdx = 0;
let role = 'joy';
let liveComments = [];
let liveReactions = {};

function currentWeek(){ return ALL_WEEKS[currentIdx]; }
function isLatest(){ return currentIdx === 0; }

async function loadLiveData(){
  const w = currentWeek();
  const [comments, reactions] = await Promise.all([
    db.getComments(w.weekOf),
    db.getReactions(w.weekOf)
  ]);
  liveComments = comments || [];
  liveReactions = {};
  (reactions||[]).forEach(r=>{ if(r.active) liveReactions[r.reaction]=true; });
  renderRightCol();
}

function shiftWeek(dir){
  const next = currentIdx + dir;
  if(next < 0 || next >= ALL_WEEKS.length) return;
  currentIdx = next;
  liveComments = []; liveReactions = {};
  render();
  loadLiveData();
}

function setRole(r){
  role = r;
  document.getElementById('rbtn-joy').classList.toggle('active', r==='joy');
  document.getElementById('rbtn-jason').classList.toggle('active', r==='jason');
  renderRightCol();
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function flash(){ const e=document.getElementById('saved'); e.classList.add('show'); setTimeout(()=>e.classList.remove('show'),1600); }

function allItems(w){
  const all=[];
  w.content.forEach(g=>g.items.forEach(i=>all.push(i)));
  w.operations.forEach(g=>g.items.forEach(i=>all.push(i)));
  w.joy.forEach(i=>all.push(i));
  return all;
}

function render(){
  const w = currentWeek();
  document.getElementById('week-chip').innerHTML =
    `${esc(w.label)}${isLatest()?'<span class="week-current-tag">current</span>':''}`;
  document.getElementById('btn-prev').disabled = currentIdx >= ALL_WEEKS.length - 1;
  document.getElementById('btn-next').disabled = currentIdx <= 0;

  const all=allItems(w);
  const total=all.length, complete=all.filter(p=>p.status==='complete').length, atrisk=all.filter(p=>p.status==='blocked'||p.status==='at-risk').length;
  document.getElementById('stats-bar').innerHTML=`
    <div class="stat"><div class="stat-num">${total}</div><div class="stat-lbl">Active projects</div></div>
    <div class="stat"><div class="stat-num">${complete}</div><div class="stat-lbl">Complete</div></div>
    <div class="stat"><div class="stat-num">${atrisk}</div><div class="stat-lbl">At risk / blocked</div></div>
    <div class="stat"><div class="stat-num">${w.wins.length}</div><div class="stat-lbl">Wins this week</div></div>`;

  document.getElementById('col-projects').innerHTML='';
  document.getElementById('col-mid').innerHTML='';
  document.getElementById('col-projects').appendChild(buildProjectsCol(w));
  document.getElementById('col-mid').appendChild(buildSimple('Key wins &amp; highlights', w.wins));
  document.getElementById('col-mid').appendChild(buildSimple('Blockers &amp; risks', w.blockers));
  document.getElementById('col-mid').appendChild(buildSimple('Upcoming milestones', w.milestones));
  renderRightCol();
}

function renderRightCol(){
  const w = currentWeek();
  const col = document.getElementById('col-right');
  col.innerHTML='';
  col.appendChild(buildDataAnalytics(w));
  col.appendChild(buildReactions());
  col.appendChild(buildComments());
}

function buildProjectsCol(w){
  const wrap=document.createElement('div');
  const mainLabel=document.createElement('div'); mainLabel.className='sec-label';
  mainLabel.innerHTML='<span class="sec-label-text">Active projects</span>';
  wrap.appendChild(mainLabel);
  ['content','operations','joy'].forEach(owner=>{
    const oh=document.createElement('div'); oh.className='owner-head';
    oh.textContent=owner==='joy'?'Joy':owner.charAt(0).toUpperCase()+owner.slice(1);
    wrap.appendChild(oh);
    if(owner==='joy'){
      const list=document.createElement('div'); list.className='items';
      w.joy.forEach(it=>list.appendChild(buildItemRow(it)));
      wrap.appendChild(list);
    } else {
      w[owner].forEach(group=>{
        const gh=document.createElement('div'); gh.className='group-head'; gh.textContent=group.category;
        wrap.appendChild(gh);
        const list=document.createElement('div'); list.className='items';
        group.items.forEach(it=>list.appendChild(buildItemRow(it)));
        wrap.appendChild(list);
      });
    }
  });
  return wrap;
}

function buildItemRow(it){
  const row=document.createElement('div'); row.className='item';
  const teamTag=it.team?`<div><span class="team-tag ${it.teamCls||'b-gray'}">${esc(it.team)}</span></div>`:'';
  const badge=`<span class="badge ${STATUS_MAP[it.status||'on-track'].cls}">${STATUS_MAP[it.status||'on-track'].label}</span>`;
  const meta=it.meta?`<div class="item-meta">${esc(it.meta)}</div>`:'';
  row.innerHTML=`<div class="item-body">${teamTag}<div class="item-text">${esc(it.text)}</div>${meta}</div>${badge}`;
  return row;
}

function buildSimple(title, items){
  const wrap=document.createElement('div');
  const label=document.createElement('div'); label.className='sec-label';
  label.innerHTML=`<span class="sec-label-text">${title}</span>`;
  wrap.appendChild(label);
  const list=document.createElement('div'); list.className='items';
  if(!items.length){ list.innerHTML='<div class="empty">Nothing this week.</div>'; }
  else { items.forEach(it=>{ const row=document.createElement('div'); row.className='item';
    row.innerHTML=`<div class="item-body"><div class="item-text">${esc(it.text)}</div>${it.meta?`<div class="item-meta">${esc(it.meta)}</div>`:''}</div>`;
    list.appendChild(row); }); }
  wrap.appendChild(list);
  return wrap;
}

function buildDataAnalytics(w){
  const wrap=document.createElement('div');
  const label=document.createElement('div'); label.className='sec-label';
  label.innerHTML='<span class="sec-label-text">Data &amp; analytics</span>';
  wrap.appendChild(label);
  const list=document.createElement('div'); list.className='items';
  w.dataLinks.forEach(link=>{ const row=document.createElement('div'); row.className='item';
    row.innerHTML=`<div class="item-body"><div class="item-text">${esc(link.text)}</div>
      <div class="item-meta"><a href="${link.url}" target="_blank" style="color:var(--blue);font-size:11px;text-decoration:none;border-bottom:1px solid var(--blue-bg)">Open spreadsheet &rarr;</a></div></div>`;
    list.appendChild(row); });
  wrap.appendChild(list);
  return wrap;
}

function buildReactions(){
  const latest=isLatest();
  const wrap=document.createElement('div');
  const label=document.createElement('div'); label.className='sec-label';
  label.innerHTML='<span class="sec-label-text">Jason\'s reactions</span>';
  wrap.appendChild(label);
  const canReact=latest&&role==='jason';
  const reacts=document.createElement('div'); reacts.className='reactions';
  reacts.innerHTML=`<span class="react-lbl">${canReact?'React:':'Reactions:'}</span>`+
    REACT_OPTS.map(opt=>`<button class="rc${liveReactions[opt]?' on':''}" ${!canReact?'disabled':''} onclick="toggleReact('${opt.replace(/'/g,"\\'")}')">${esc(opt)}</button>`).join('');
  if(!latest){ const note=document.createElement('div'); note.className='past-notice'; note.textContent='Viewing a past week \u2014 reactions are read-only.'; wrap.appendChild(note); }
  wrap.appendChild(reacts);
  return wrap;
}

function buildComments(){
  const latest=isLatest();
  const wrap=document.createElement('div');
  const label=document.createElement('div'); label.className='sec-label';
  label.innerHTML=`<span class="sec-label-text">Comments (${liveComments.length})</span>`;
  wrap.appendChild(label);
  if(!liveComments.length){ const e=document.createElement('div'); e.className='empty'; e.textContent='No comments yet.'; wrap.appendChild(e); }
  else {
    liveComments.forEach(c=>{
      const isJoy=c.who==='joy';
      const div=document.createElement('div'); div.className='comment';
      const del=(latest&&role===c.who)?`<button class="cdel" onclick="deleteComment('${c.id}')">&#x2715; remove</button>`:'';
      div.innerHTML=`<div class="av ${isJoy?'av-joy':'av-jason'}">${isJoy?'JP':'JA'}</div>
        <div class="cb"><div class="cw">${isJoy?'Joy Powell':'Jason Abrams'}</div>
        <div class="ct">${esc(c.message)}</div>${del}</div>`;
      wrap.appendChild(div);
    });
  }
  if(latest){
    const inputRow=document.createElement('div'); inputRow.className='comment-input-row';
    inputRow.innerHTML=`<div class="av ${role==='joy'?'av-joy':'av-jason'}">${role==='joy'?'JP':'JA'}</div>
      <textarea class="comment-ta" id="comment-ta" placeholder="${role==='joy'?'Joy':'Jason'}, add a comment..." rows="1"></textarea>
      <button class="csend" onclick="addComment()">Send</button>`;
    wrap.appendChild(inputRow);
  } else {
    const note=document.createElement('div'); note.className='past-notice'; note.textContent='Viewing a past week \u2014 comments are read-only.';
    wrap.appendChild(note);
  }
  return wrap;
}

async function toggleReact(opt){
  if(role!=='jason'||!isLatest()) return;
  const newState=!liveReactions[opt];
  liveReactions[opt]=newState;
  renderRightCol();
  await db.upsertReaction(currentWeek().weekOf, opt, newState);
  flash();
}

async function addComment(){
  if(!isLatest()) return;
  const ta=document.getElementById('comment-ta'); if(!ta) return;
  const text=ta.value.trim(); if(!text) return;
  ta.value='';
  await db.addComment(currentWeek().weekOf, role, text);
  await loadLiveData();
  flash();
}

async function deleteComment(id){
  if(!isLatest()) return;
  await db.deleteComment(id);
  await loadLiveData();
}

function buildExportText(){
  const w=currentWeek();
  const lines=[`WEEKLY UPDATE \u2014 ${w.label.toUpperCase()}`,'Joy Powell \u00b7 Industry & Learning Operations, KWRI',''];
  lines.push('ACTIVE PROJECTS','='.repeat(44),'');
  ['content','operations','joy'].forEach(owner=>{
    lines.push(owner==='joy'?'Joy':owner.charAt(0).toUpperCase()+owner.slice(1));
    lines.push('\u2500'.repeat(32));
    if(owner==='joy'){ w.joy.forEach(it=>lines.push(`  \u2022 ${it.text}  [${STATUS_MAP[it.status||'on-track'].label}]${it.meta?' \u2014 '+it.meta:''}`)); }
    else { w[owner].forEach(g=>{ lines.push(`  ${g.category}`); g.items.forEach(it=>lines.push(`    \u2022 ${it.text}  [${STATUS_MAP[it.status||'on-track'].label}]${it.meta?' \u2014 '+it.meta:''}`)); }); }
    lines.push('');
  });
  lines.push('KEY WINS & HIGHLIGHTS','='.repeat(44));
  w.wins.forEach(x=>lines.push(`\u2022 ${x.text}${x.meta?' \u2014 '+x.meta:''}`));
  lines.push('');
  lines.push('BLOCKERS & RISKS','='.repeat(44));
  w.blockers.forEach(x=>lines.push(`\u2022 ${x.text}${x.meta?' \u2014 '+x.meta:''}`));
  lines.push('');
  lines.push('UPCOMING MILESTONES','='.repeat(44));
  w.milestones.forEach(x=>lines.push(`\u2022 ${x.text}${x.meta?' \u2014 '+x.meta:''}`));
  if(liveComments.length){
    lines.push('','COMMENTS','='.repeat(44));
    liveComments.forEach(c=>lines.push(`[${c.who==='joy'?'Joy Powell':'Jason Abrams'}] ${c.message}`));
  }
  return lines.join('\n');
}

function openExport(){ document.getElementById('export-body').textContent=buildExportText(); document.getElementById('export-overlay').classList.add('open'); }
function closeExport(){ document.getElementById('export-overlay').classList.remove('open'); }
function copyExport(){
  navigator.clipboard.writeText(buildExportText()).then(()=>{
    const btn=document.getElementById('copy-btn'); btn.textContent='Copied!';
    setTimeout(()=>btn.textContent='Copy to clipboard',2000);
  });
}
document.getElementById('export-overlay').addEventListener('click',e=>{ if(e.target===e.currentTarget) closeExport(); });

render();
loadLiveData();
setInterval(()=>{ if(isLatest()) loadLiveData(); }, 30000);
</script>
