:root{

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--page);color:var(--ink);min-height:100vh}
.masthead{border-bottom:2px solid var(--ink);padding:1.75rem 3rem 1.25rem;display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.kicker{font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.masthead h1{font-family:'DM Serif Display',serif;font-size:clamp(26px,4vw,40px);line-height:1;letter-spacing:-.01em}
.masthead-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;letter-spacing:.03em;padding:8px 16px;border-radius:2px;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-ghost{background:transparent;color:var(--ink-2);border:1.5px solid var(--rule)}
.btn-ghost:hover{border-color:var(--ink-2);color:var(--ink)}
.btn-primary{background:var(--ink);color:var(--page);border:1.5px solid var(--ink)}
.btn-primary:hover{background:var(--accent);border-color:var(--accent)}
.week-select{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;color:var(--ink-2);padding:6px 12px;background:var(--cream);border:1.5px solid var(--rule);border-radius:2px;cursor:pointer;outline:none}
.role-wrap{display:flex;align-items:center;gap:6px}
.role-lbl{font-size:11px;color:var(--ink-3)}
.rtoggle{display:flex;border:1.5px solid var(--rule);border-radius:2px;overflow:hidden}
.rbtn{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;padding:6px 14px;cursor:pointer;border:none;background:transparent;color:var(--ink-2);transition:all .15s}
.rbtn.active{background:var(--ink);color:var(--page)}
.sync-status{font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:4px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block}
.sync-dot.loading{background:var(--amber)}
.sync-dot.error{background:var(--red)}
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);border-bottom:1px solid var(--rule)}
.stat{background:var(--page);padding:1rem 2rem}
.stat-num{font-family:'DM Serif Display',serif;font-size:32px;color:var(--ink)}
.stat-lbl{font-size:11px;color:var(--ink-3);margin-top:2px;letter-spacing:.04em}
.body-wrap{max-width:1400px;margin:0 auto}
.layout{display:grid;grid-template-columns:2fr 1fr 1fr}
.col{padding:2rem 2.5rem;border-right:1px solid var(--rule)}
.col:last-child{border-right:none}
.sec-label{display:flex;align-items:center;gap:10px;margin-bottom:.75rem;margin-top:1.75rem}
.col>.sec-label:first-child{margin-top:0}
.sec-label-text{font-size:10px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.sec-label::after{content:'';flex:1;height:1px;background:var(--rule)}
.owner-head{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);padding:10px 0 6px;border-bottom:2px solid var(--ink);margin-top:1.75rem;margin-bottom:4px}
.group-head{font-size:11px;font-weight:500;color:var(--ink-2);padding:8px 0 4px;border-bottom:1px dashed var(--rule);margin-top:1rem;margin-bottom:2px}
.items{display:flex;flex-direction:column}

.item:last-child{border-bottom:none}
.item-body{flex:1;min-width:0}
.item-text{font-size:13px;line-height:1.5;color:var(--ink)}
.item-meta{font-size:11px;color:var(--ink-3);margin-top:2px;line-height:1.5}
.badge{font-size:10px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:2px;white-space:nowrap;flex-shrink:0;margin-top:3px}

.b-amber{background:var(--amber-bg);color:var(--amber)}
.b-red{background:var(--red-bg);color:var(--red)}
.b-blue{background:var(--blue-bg);color:var(--blue)}

.av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;flex-shrink:0;margin-top:2px}

.overlay{display:none;position:fixed;inset:0;background:rgba(26,24,20,.55);z-index:200;align-items:center;justify-content:center}

.export-text{font-family:monospace;font-size:12px;line-height:1.7;white-space:pre-wrap;background:var(--cream);border:1px solid var(--rule);padding:1rem;max-height:360px;overflow-y:auto;color:var(--ink-2)}

.empty{font-size:12px;color:var(--ink-3);font-style:italic;padding:6px 0 10px}

function setSyncStatus(state){
  var dot=document.getElementById('sync-dot'), lbl=document.getElementById('sync-label');
  if(!dot) return;
  dot.className='sync-dot'+(state==='loading'?' loading':state==='error'?' error':'');
  lbl.textContent=state==='loading'?'Syncing...':state==='error'?'Offline':'Live';
}

function dbReq(method, path, body){
  setSyncStatus('loading');
  return fetch(SUPABASE_URL+'/rest/v1/'+path, {
    method: method,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer '+SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': method==='POST' ? 'return=representation' : ''
    },
    body: body ? JSON.stringify(body) : undefined
  }).then(function(res){
    setSyncStatus('ok');
    return res.text();
  }).then(function(text){
    try { return text ? JSON.parse(text) : []; } catch(e){ return []; }
  }).catch(function(e){
    setSyncStatus('error');

  });

        {text:'Family Reunion', team:"Robert's Team", teamCls:'b-blue', meta:'Met with Mona, Robert & Kara 2x to transfer knowledge. Goal: breakouts ready to present in May.', status:'on-track'},
        {text:'Mega Camp', team:"Robert's Team", teamCls:'b-blue', meta:'Nomination form presenting on Growth Call in two weeks.', status:'on-track'}
      ]}
    ],
    operations: [
      { category: 'Learning Center', items: [{text:'Registration tracking system', team:'Ops Team', teamCls:'b-amber', meta:'Created system with Events & Janelle. Confirmed MC Financial speakers and created flyer.', status:'on-track'}]},
      { category: 'Masterminds', items: [{text:'Masterminds In-Person', team:'Ops Team', teamCls:'b-amber', meta:'Individual Agents: 96 · Teams/Groups/MREA: 67 · Business: 21 · Top 100 TLs: 23 · Top Single OP: 9 · Top Multiple OP: 16', status:'on-track'}]}
    ],
    joy: [{text:'Course creation process', meta:"Drafting from old working theory + Jason's input", status:'on-track'}],
    wins: [{text:'KW Productivity Huddle — first call went well!', meta:'Learned some lessons along the way'}],
    blockers: [{text:'AI Videos — Marketing wants to own strategy', meta:'Blocking progress on AI video pipeline'}],
    milestones: [
      {text:'Growth Call — Mega Camp nomination form', meta:'Presenting in two weeks'},
      {text:'FR breakouts', meta:'Goal to have breakouts ready to present in May'}
    ],
    dataLinks: [{text:'Self-Study Data', url:'https://docs.google.com/spreadsheets/d/1Y4AOvoDxUCG2xCwN0Gq7Z1tM7fpbzvehaISLNMzqIC8/edit?gid=1549248158#gid=1549248158'}]
  }
];

var currentIdx = 0;
var role = 'joy';
var liveComments = [];
var liveReactions = {};

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function flash(){ var e=document.getElementById('saved'); e.classList.add('show'); setTimeout(function(){ e.classList.remove('show'); },1600); }
function currentWeek(){ return ALL_WEEKS[currentIdx]; }
function isLatest(){ return currentIdx===0; }

function allItems(w){
  var all=[];
  w.content.forEach(function(g){ g.items.forEach(function(i){ all.push(i); }); });
  w.operations.forEach(function(g){ g.items.forEach(function(i){ all.push(i); }); });
  w.joy.forEach(function(i){ all.push(i); });
  return all;
}

function render(){
  var w = currentWeek();
  var all = allItems(w);
  var total=all.length;
  var complete=all.filter(function(p){ return p.status==='complete'; }).length;
  var atrisk=all.filter(function(p){ return p.status==='blocked'||p.status==='at-risk'; }).length;

  document.getElementById('stats-bar').innerHTML =
    '<div class="stat"><div class="stat-num">'+total+'</div><div class="stat-lbl">Active projects</div></div>'+
    '<div class="stat"><div class="stat-num">'+complete+'</div><div class="stat-lbl">Complete</div></div>'+
    '<div class="stat"><div class="stat-num">'+atrisk+'</div><div class="stat-lbl">At risk / blocked</div></div>'+
    '<div class="stat"><div class="stat-num">'+w.wins.length+'</div><div class="stat-lbl">Wins this week</div></div>';

  var cp = document.getElementById('col-projects');
  var cm = document.getElementById('col-mid');
  var cr = document.getElementById('col-right');
  cp.innerHTML=''; cm.innerHTML=''; cr.innerHTML='';

  cp.appendChild(buildProjectsCol(w));
  cm.appendChild(buildSimple('Key wins &amp; highlights', w.wins));
  cm.appendChild(buildSimple('Blockers &amp; risks', w.blockers));
  cm.appendChild(buildSimple('Upcoming milestones', w.milestones));
  cr.appendChild(buildDataAnalytics(w));
  cr.appendChild(buildReactions());
  cr.appendChild(buildComments());
}

function buildProjectsCol(w){
  var wrap=document.createElement('div');
  var mainLabel=document.createElement('div'); mainLabel.className='sec-label';
  mainLabel.innerHTML='<span class="sec-label-text">Active projects</span>';
  wrap.appendChild(mainLabel);
  ['content','operations','joy'].forEach(function(owner){
    var oh=document.createElement('div'); oh.className='owner-head';
    oh.textContent=owner==='joy'?'Joy':owner.charAt(0).toUpperCase()+owner.slice(1);
    wrap.appendChild(oh);
    if(owner==='joy'){
      var list=document.createElement('div'); list.className='items';
      w.joy.forEach(function(it){ list.appendChild(buildItemRow(it)); });
      wrap.appendChild(list);
    } else {
      w[owner].forEach(function(group){
        var gh=document.createElement('div'); gh.className='group-head'; gh.textContent=group.category;
        wrap.appendChild(gh);
        var list=document.createElement('div'); list.className='items';
        group.items.forEach(function(it){ list.appendChild(buildItemRow(it)); });
        wrap.appendChild(list);
      });
    }
  });
  return wrap;
}

function buildItemRow(it){
  var row=document.createElement('div'); row.className='item';
  var teamTag=it.team?'<div><span class="team-tag '+(it.teamCls||'b-gray')+'">'+esc(it.team)+'</span></div>':'';
  var s=STATUS_MAP[it.status||'on-track'];
  var badge='<span class="badge '+s.cls+'">'+s.label+'</span>';
  var meta=it.meta?'<div class="item-meta">'+esc(it.meta)+'</div>':'';
  row.innerHTML='<div class="item-body">'+teamTag+'<div class="item-text">'+esc(it.text)+'</div>'+meta+'</div>'+badge;
  return row;
}

function buildSimple(title, items){
  var wrap=document.createElement('div');
  var label=document.createElement('div'); label.className='sec-label';
  label.innerHTML='<span class="sec-label-text">'+title+'</span>';
  wrap.appendChild(label);
  var list=document.createElement('div'); list.className='items';
  if(!items.length){ list.innerHTML='<div class="empty">Nothing this week.</div>'; }
  else { items.forEach(function(it){
    var row=document.createElement('div'); row.className='item';
    row.innerHTML='<div class="item-body"><div class="item-text">'+esc(it.text)+'</div>'+(it.meta?'<div class="item-meta">'+esc(it.meta)+'</div>':'')+'</div>';
    list.appendChild(row);
  }); }
  wrap.appendChild(list);
  return wrap;
}

function buildDataAnalytics(w){
  var wrap=document.createElement('div');
  var label=document.createElement('div'); label.className='sec-label';
  label.innerHTML='<span class="sec-label-text">Data &amp; analytics</span>';
  wrap.appendChild(label);
  var list=document.createElement('div'); list.className='items';
  w.dataLinks.forEach(function(link){
    var row=document.createElement('div'); row.className='item';
    row.innerHTML='<div class="item-body"><div class="item-text">'+esc(link.text)+'</div><div class="item-meta"><a href="'+link.url+'" target="_blank" style="color:var(--blue);font-size:11px;text-decoration:none;border-bottom:1px solid var(--blue-bg)">Open spreadsheet &rarr;</a></div></div>';
    list.appendChild(row);
  });
  wrap.appendChild(list);
  return wrap;
}

function buildReactions(){
  var latest=isLatest();
  var wrap=document.createElement('div');
  var label=document.createElement('div'); label.className='sec-label';
  label.innerHTML='<span class="sec-label-text">Jason\'s reactions</span>';
  wrap.appendChild(label);
  var canReact=latest&&role==='jason';
  var reacts=document.createElement('div'); reacts.className='reactions';
  var html='<span class="react-lbl">'+(canReact?'React:':'Reactions:')+'</span>';
  REACT_OPTS.forEach(function(opt){
    html+='<button class="rc'+(liveReactions[opt]?' on':'')+'"'+(canReact?'':' disabled')+' data-react="'+esc(opt)+'">'+esc(opt)+'</button>';
  });
  reacts.innerHTML=html;
  reacts.querySelectorAll('[data-react]').forEach(function(btn){
    btn.addEventListener('click', function(){
      if(!canReact) return;
      var opt=btn.getAttribute('data-react');
      liveReactions[opt]=!liveReactions[opt];
      dbReq('POST','reactions',{week_of:currentWeek().weekOf, reaction:opt, active:liveReactions[opt], updated_at:new Date().toISOString()}).then(function(){ flash(); });
      render();
    });
  });
  if(!latest){ var note=document.createElement('div'); note.className='past-notice'; note.textContent='Viewing a past week — reactions are read-only.'; wrap.appendChild(note); }
  wrap.appendChild(reacts);
  return wrap;
}

function buildComments(){
  var latest=isLatest();
  var wrap=document.createElement('div');
  var label=document.createElement('div'); label.className='sec-label';
  label.innerHTML='<span class="sec-label-text">Comments ('+liveComments.length+')</span>';
  wrap.appendChild(label);
  if(!liveComments.length){ var e=document.createElement('div'); e.className='empty'; e.textContent='No comments yet.'; wrap.appendChild(e); }
  else {
    liveComments.forEach(function(c,i){
      var isJoy=c.who==='joy';
      var div=document.createElement('div'); div.className='comment';
      div.innerHTML='<div class="av '+(isJoy?'av-joy':'av-jason')+'">'+(isJoy?'JP':'JA')+'</div><div class="cb"><div class="cw">'+(isJoy?'Joy Powell':'Jason Abrams')+'</div><div class="ct">'+esc(c.message)+'</div>'+(latest&&role===c.who?'<button class="cdel" data-id="'+c.id+'">&times; remove</button>':'')+'</div>';
      wrap.appendChild(div);
    });
    wrap.querySelectorAll('.cdel').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id=btn.getAttribute('data-id');
        dbReq('DELETE','comments?id=eq.'+id).then(function(){ loadLiveData(); });
      });
    });
  }
  if(latest){
    var inputRow=document.createElement('div'); inputRow.className='comment-input-row';
    inputRow.innerHTML='<div class="av '+(role==='joy'?'av-joy':'av-jason')+'">'+(role==='joy'?'JP':'JA')+'</div><textarea class="comment-ta" id="comment-ta" placeholder="'+(role==='joy'?'Joy':'Jason')+', add a comment..." rows="1"></textarea><button class="csend" id="csend-btn">Send</button>';
    wrap.appendChild(inputRow);
    setTimeout(function(){
      var sendBtn=document.getElementById('csend-btn');
      if(sendBtn){ sendBtn.addEventListener('click', function(){
        var ta=document.getElementById('comment-ta');
        var text=ta.value.trim(); if(!text) return;
        ta.value='';
        dbReq('POST','comments',{week_of:currentWeek().weekOf, who:role, message:text}).then(function(){ loadLiveData(); flash(); });
      }); }
    }, 0);
  } else {
    var note=document.createElement('div'); note.className='past-notice'; note.textContent='Viewing a past week — comments are read-only.';
    wrap.appendChild(note);
  }
  return wrap;
}

function loadLiveData(){
  var weekOf=currentWeek().weekOf;
  Promise.all([
    dbReq('GET','comments?week_of=eq.'+weekOf+'&order=created_at.asc'),
    dbReq('GET','reactions?week_of=eq.'+weekOf)
  ]).then(function(results){
    liveComments=Array.isArray(results[0])?results[0]:[];
    liveReactions={};
    (Array.isArray(results[1])?results[1]:[]).forEach(function(r){ if(r.active) liveReactions[r.reaction]=true; });
    var cr=document.getElementById('col-right');
    cr.innerHTML='';
    cr.appendChild(buildDataAnalytics(currentWeek()));
    cr.appendChild(buildReactions());
    cr.appendChild(buildComments());
  }).catch(function(e){ console.error('loadLiveData error:',e); });
}

function buildExportText(){
  var w=currentWeek();
  var lines=['WEEKLY UPDATE — '+w.label.toUpperCase(),'Joy Powell · Industry & Learning Operations, KWRI',''];
  lines.push('ACTIVE PROJECTS','='.repeat(44),'');
  ['content','operations','joy'].forEach(function(owner){
    lines.push(owner==='joy'?'Joy':owner.charAt(0).toUpperCase()+owner.slice(1));
    lines.push('—'.repeat(32));
    if(owner==='joy'){ w.joy.forEach(function(it){ lines.push('  • '+it.text+'  ['+STATUS_MAP[it.status||'on-track'].label+']'+(it.meta?' — '+it.meta:'')); }); }
    else { w[owner].forEach(function(g){ lines.push('  '+g.category); g.items.forEach(function(it){ lines.push('    • '+it.text+'  ['+STATUS_MAP[it.status||'on-track'].label+']'+(it.meta?' — '+it.meta:'')); }); }); }
    lines.push('');
  });
  lines.push('KEY WINS & HIGHLIGHTS','='.repeat(44));
  w.wins.forEach(function(x){ lines.push('• '+x.text+(x.meta?' — '+x.meta:'')); });
  lines.push('');
  lines.push('BLOCKERS & RISKS','='.repeat(44));
  w.blockers.forEach(function(x){ lines.push('• '+x.text+(x.meta?' — '+x.meta:'')); });
  lines.push('');
  lines.push('UPCOMING MILESTONES','='.repeat(44));
  w.milestones.forEach(function(x){ lines.push('• '+x.text+(x.meta?' — '+x.meta:'')); });
  if(liveComments.length){
    lines.push('','COMMENTS','='.repeat(44));
    liveComments.forEach(function(c){ lines.push('['+(c.who==='joy'?'Joy Powell':'Jason Abrams')+'] '+c.message); });
  }
  return lines.join('\n');
}

// ── Init — attach all events after DOM ready ──────────────────────────
document.addEventListener('DOMContentLoaded', function(){

  // Populate week dropdown
  var sel=document.getElementById('week-select');
  ALL_WEEKS.forEach(function(w,i){
    var opt=document.createElement('option');
    opt.value=i; opt.textContent=w.label;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', function(){
    currentIdx=parseInt(sel.value);
    liveComments=[]; liveReactions={};
    render();
    loadLiveData();
  });

  // Role toggle
  document.getElementById('rbtn-joy').addEventListener('click', function(){
    role='joy';
    document.getElementById('rbtn-joy').classList.add('active');
    document.getElementById('rbtn-jason').classList.remove('active');
    render();
  });
  document.getElementById('rbtn-jason').addEventListener('click', function(){
    role='jason';
    document.getElementById('rbtn-jason').classList.add('active');
    document.getElementById('rbtn-joy').classList.remove('active');
    render();
  });

  // Export
  document.getElementById('export-btn').addEventListener('click', function(){
    document.getElementById('export-body').textContent=buildExportText();
    document.getElementById('export-overlay').classList.add('open');
  });
  document.getElementById('close-export-btn').addEventListener('click', function(){
    document.getElementById('export-overlay').classList.remove('open');
  });
  document.getElementById('copy-btn').addEventListener('click', function(){
    navigator.clipboard.writeText(buildExportText()).then(function(){
      document.getElementById('copy-btn').textContent='Copied!';
      setTimeout(function(){ document.getElementById('copy-btn').textContent='Copy to clipboard'; },2000);
    });
  });
  document.getElementById('export-overlay').addEventListener('click', function(e){
    if(e.target===document.getElementById('export-overlay')) document.getElementById('export-overlay').classList.remove('open');
  });

  render();
  loadLiveData();
  setInterval(function(){ if(isLatest()) loadLiveData(); }, 30000);
});
</script>
</body>
</html>
